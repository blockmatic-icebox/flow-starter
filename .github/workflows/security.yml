name: Security

# Local parity: `pnpm security:check`
# Manual on GitHub: `gh workflow run Security`

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - name: Install verified scanners
        run: |
          node scripts/setup-gitleaks.mjs
          node scripts/setup-osv-scanner.mjs

      - name: Run security checks
        run: pnpm security:check
