name: CI

# Local parity: `pnpm ci:local` (product). Factory: `pnpm ci:factory:local` or workflow_dispatch factory job.
# Manual on GitHub: `gh workflow run CI`

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-pnpm

      - name: Install verified gitleaks
        run: node tooling/setup/setup-gitleaks.mjs

      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm sherif
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm --filter @repo/db db:check
      - run: pnpm eval:genui:offline

      - name: Install Playwright Chromium
        run: pnpm setup:playwright

      - run: pnpm test:browser

      - name: Turborepo remote cache
        if: vars.TURBO_TEAM != ''
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - run: pnpm build

  factory:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm --dir .agents install
      - run: pnpm --dir .agents check:factory
      - run: pnpm --dir .agents test
