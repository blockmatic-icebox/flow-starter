name: CI

# Remote auto-run is off until you uncomment `push` / `pull_request` below.
# Local parity: `pnpm ci:local`
# Manual on GitHub: `gh workflow run CI`
# Local runner: `act workflow_dispatch -W .github/workflows/ci.yml`

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm

      - name: Install gitleaks
        run: |
          wget -q -O /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install OSV Scanner
        run: |
          wget -q -O /tmp/osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner

      - run: pnpm flow:test
      - run: pnpm flow:check
      - run: pnpm architecture:test
      - run: pnpm architecture:check
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm sherif
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm --filter @repo/db db:check
      - run: pnpm test:scripts
      - run: pnpm security:check
      - run: pnpm build
