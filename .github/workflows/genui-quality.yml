name: GenUI quality

# Remote auto-run is off until you uncomment `push` / `pull_request` below.
# Local parity: `pnpm --filter @repo/genui test && pnpm lint && pnpm check-types`
# Manual on GitHub: `gh workflow run "GenUI quality"`
# Local runner: `act workflow_dispatch -W .github/workflows/genui-quality.yml`

on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "packages/genui/**"
  #     - "apps/web/app/api/genui/**"
  #     - "apps/web/app/genui-demo/**"
  #     - "apps/web/lib/genui/**"
  #     - "package.json"
  #     - "pnpm-lock.yaml"
  # push:
  #   branches: [main]
  #   paths:
  #     - "packages/genui/**"
  #     - "apps/web/app/api/genui/**"
  #     - "apps/web/lib/genui/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  genui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm flow:check
      - run: pnpm --filter @repo/genui test
      - run: pnpm lint
      - run: pnpm check-types
